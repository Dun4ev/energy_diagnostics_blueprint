services:
  db:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: energy_diagnostics
      POSTGRES_USER: energy_diagnostics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: energy_diagnostics
      DB_USER: energy_diagnostics
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      API_REFERENCE_FIXTURE_PATH: /app/reference/reference-snapshot.json
      API_REFERENCE_EXAMPLES_DIR: /app/reference-examples
      DIAGNOSTIC_POLICY_PATH: /app/config/diagnostic-policy.demo.json

      DEMO_ENGINEER_PASSWORD: ${DEMO_ENGINEER_PASSWORD:?Run scripts/init_local_env.py}
      DEMO_APPROVER_PASSWORD: ${DEMO_APPROVER_PASSWORD:?Run scripts/init_local_env.py}
      DEMO_TECHNICIAN_PASSWORD: ${DEMO_TECHNICIAN_PASSWORD:?Run scripts/init_local_env.py}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:?Run scripts/init_local_env.py}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Run scripts/init_local_env.py}
      DEMO_ENGINEER_CASE_CONFIRM: "true"
      API_ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173
    volumes:
      - ../contracts/fixtures:/app/reference:ro
      - ../contracts/examples:/app/reference-examples:ro
      - ../config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    command: ["python", "-m", "apps.worker.main"]
    environment:
      WORKER_ENABLED: "true"
      OBSERVATIONS_DIR: /app/data/observations
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: energy_diagnostics
      DB_USER: energy_diagnostics
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      API_REFERENCE_FIXTURE_PATH: /app/reference/reference-snapshot.json
      API_REFERENCE_EXAMPLES_DIR: /app/reference-examples
      DIAGNOSTIC_POLICY_PATH: /app/config/diagnostic-policy.demo.json
    volumes:
      - ../contracts/fixtures:/app/reference:ro
      - ../contracts/examples:/app/reference-examples:ro
      - ../config:/app/config:ro
      - type: bind
        source: ../data/observations
        target: /app/data/observations
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  postgres-data:
