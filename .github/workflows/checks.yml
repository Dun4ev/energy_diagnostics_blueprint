name: Foundation contracts
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npm run lint
      - run: npm run contracts:check
      - run: uv run --frozen pytest tests/contracts
      - run: uv run --frozen python tests/test_blueprint.py
      - run: npm test
      - run: npm run build
      - run: POSTGRES_PASSWORD=ci-ephemeral docker compose -p energy-diagnostics -f infra/compose.yaml up --build -d --wait
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
