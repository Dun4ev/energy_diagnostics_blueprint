[project]
name = "energy-diagnostics"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "sqlalchemy==2.1.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/contracts"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
